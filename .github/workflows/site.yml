# Deploys site/ to Cloudflare Pages when it changes on main.

name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

env:
  PROJECT: stage-browser
  WRANGLER: wrangler@4.161.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets; its deployment rules limit it to main.
    environment:
      name: site
      url: https://stagebrowser.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Old drafts in site/backup-* stay in the repo but are not published.
      - name: Collect the site
        run: rsync -a --exclude 'backup-*/' site/ public/

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes "$WRANGLER" pages project list | grep -qw "$PROJECT"; then
            npx --yes "$WRANGLER" pages project create "$PROJECT" --production-branch main
          fi
          npx --yes "$WRANGLER" pages deploy public --project-name "$PROJECT" --branch main --commit-dirty=true
