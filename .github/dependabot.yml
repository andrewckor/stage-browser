version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Types for the oldest Node Stage supports (engines: >=22), so the type
      # checker rejects newer Node APIs. The `stage` command runs on the user's
      # Node; the app on Electron's (24 in Electron 45), which covers 22. Raise
      # this together with engines, when Node 22 reaches end of life (2027-04-30).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
